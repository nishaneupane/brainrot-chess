<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainrot Chess League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,800;0,900;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1214;--panel:#171c1f;--line:#2a3236;--ink:#63b7b7;--dim:#8fa9a9;--pink:#F88484;--teal:#63b7b7;--lt:#24393b;--dk:#172426;
  --display:"Montserrat",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  background-image:radial-gradient(circle at 12% 0%,#F8848426,transparent 42%),radial-gradient(circle at 92% 18%,#63b7b71f,transparent 42%)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
h1,h2{font-family:var(--display);margin:0}
h1{font-size:clamp(36px,7vw,72px);font-weight:900;line-height:.95;letter-spacing:-.02em;transform:rotate(-1.5deg);color:var(--teal);text-shadow:4px 4px 0 #0a0d0e}
h1 em{font-style:normal;color:var(--pink)}
h2{font-size:21px;font-weight:800;margin-bottom:14px}
.sub{color:var(--dim);margin:14px 0 18px}
.ticker{overflow:hidden;white-space:nowrap;background:var(--pink);color:#1a0f0f;font:700 15px var(--display);padding:8px 0;margin:0 -16px 24px;transform:rotate(.6deg)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:16px}}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:760px){.hero{grid-template-columns:1fr 1fr}}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:900 34px/1.1 var(--display);overflow-wrap:anywhere}
.stat small{color:var(--dim)}
.stat.hot{border-color:var(--pink);box-shadow:5px 5px 0 var(--pink)}
.stat.hot b{color:var(--pink)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.sticker{display:inline-block;background:var(--teal);color:#0d1f1f;font:800 12px var(--display);padding:3px 8px;border-radius:999px;transform:rotate(-4deg);margin-left:8px;vertical-align:middle}
svg text{fill:var(--dim);font:12px var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:18px;color:var(--dim);font-size:14px;margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--dim);font:500 12px var(--display);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.rank{font:900 18px var(--display)}
td.n{font:700 15px var(--display);min-width:170px}
td.n small{display:block;color:var(--dim);font:400 13px/1.45 var(--body);margin-top:2px}
.aura{font:800 15px var(--display);white-space:nowrap}.aura.pos{color:var(--teal)}.aura.neg{color:var(--pink)}
.bar{height:8px;background:var(--line);border-radius:4px;min-width:70px;margin-top:4px}
.bar div{height:100%;border-radius:4px;background:var(--teal)}
.trash{color:var(--dim);font-style:italic;font-size:14px;min-width:200px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);border:2px solid var(--line)}
.tabs button.on{background:var(--pink);border-color:var(--pink);color:#1a0f0f}
button{font:700 15px var(--display);background:var(--pink);color:#1a0f0f;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.who{font-size:14px;color:var(--dim);margin-bottom:10px}.who b{color:var(--ink);font-family:var(--display)}
.stage{display:flex;gap:16px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(100%,360px);aspect-ratio:1;border:4px solid #000;border-radius:6px;overflow:hidden;flex:none}
.sq{min-height:0;display:flex;align-items:center;justify-content:center;font-size:min(8vw,34px);line-height:1;user-select:none;font-family:"Segoe UI Symbol","DejaVu Sans",sans-serif}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.pw{color:var(--pink);text-shadow:0 2px 0 #0008}.pb{color:var(--teal);text-shadow:0 2px 0 #0008}
.feed{flex:1 1 220px;min-width:0;height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:14px}
.feed div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.feed div b{color:var(--teal);margin-right:6px;font-family:var(--display)}
.feed .big{border-color:var(--pink);color:var(--pink)}
.controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.controls span{color:var(--dim);font-size:14px}
.chain{list-style:none;margin:0;padding:0}
.chain li{position:relative;padding:0 0 14px 26px}
.chain li:before{content:"";position:absolute;left:5px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--teal)}
.chain li:not(:last-child):after{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.chain li:first-child:before{background:var(--pink);box-shadow:0 0 14px var(--pink)}
.chain b{font-family:var(--display)}
.chain small{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Brainrot <em>Chess</em> League</h1>
  <p class="sub" id="sub"></p>
  <div class="ticker"><span id="ticker"></span></div>
  <div class="hero" id="hero"></div>

  <div class="card">
    <h2>Aura went up <span class="sticker">no cap</span></h2>
    <svg id="chart" viewBox="0 0 900 300" width="100%" role="img" aria-label="Win rate against the NPC bot by generation"></svg>
    <div class="legend"><span><i style="background:var(--pink)"></i>Best bot</span><span><i style="background:var(--teal)"></i>Average bot</span><span><i style="background:var(--dim)"></i>Coin flip (50%)</span></div>
  </div>

  <div class="card">
    <h2>Replays vs NPC Bot</h2>
    <div class="tabs" id="tabs"></div>
    <div class="who" id="who"></div>
    <div class="stage">
      <div class="board" id="board"></div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="controls"><button id="play">Play</button><button id="skip" style="background:var(--teal);color:#0d1f1f">Skip to end</button><span id="ply"></span></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>Aura leaderboard</h2>
      <div class="tablewrap"><table id="lb"></table></div>
    </div>
    <div class="card">
      <h2>Champion bloodline</h2>
      <ul class="chain" id="tree"></ul>
    </div>
  </div>
</div>
<script>
const D = /*DATA*/null;
const pct = x => Math.round(x * 100) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const first = D.gens[0], last = D.gens[D.gens.length - 1];

document.getElementById("sub").textContent =
  `${D.gens.length - 1} generations of chess bots fighting, dying and breeding. Only the ones with aura survive. Run ${D.run}.`;
document.getElementById("ticker").textContent = D.board.filter(a => a.trash).map(a => `${a.name}: "${a.trash}"`).join("     /     ");
document.getElementById("hero").innerHTML = [
  [pct(first.avg), "avg W rate vs NPC, gen 0", ""],
  [pct(last.avg), `avg W rate vs NPC, gen ${last.g}`, "hot"],
  [D.deaths, "bots deleted", ""],
  [D.board[0].name, "reigning champion", ""],
].map(([b, s, c]) => `<div class="stat ${c}"><b>${esc(b)}</b><small>${s}</small></div>`).join("");

// chart
(() => {
  const W = 900, H = 300, L = 44, R = 16, T = 12, B = 34, n = D.gens.length;
  const x = i => L + (W - L - R) * (n === 1 ? 0 : i / (n - 1)), y = v => T + (H - T - B) * (1 - v);
  let s = "";
  for (const v of [0, .25, .5, .75, 1]) s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2a3236"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${pct(v)}</text>`;
  D.gens.forEach((g, i) => { if (n < 16 || i % 2 === 0) s += `<text x="${x(i)}" y="${H-12}" text-anchor="middle">G${g.g}</text>`; });
  s += `<line x1="${L}" x2="${W-R}" y1="${y(.5)}" y2="${y(.5)}" stroke="#8fa9a9" stroke-dasharray="5 5"/>`;
  for (const [k, c] of [["best", "#F88484"], ["avg", "#63b7b7"]]) {
    s += `<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" points="${D.gens.map((g, i) => x(i) + "," + y(g[k])).join(" ")}"/>`;
    D.gens.forEach((g, i) => s += `<circle cx="${x(i)}" cy="${y(g[k])}" r="4" fill="${c}"><title>Gen ${g.g} ${k}: ${pct(g[k])}</title></circle>`);
  }
  document.getElementById("chart").innerHTML = s;
})();

// leaderboard
const medal = i => i + 1;
document.getElementById("lb").innerHTML =
  `<tr><th></th><th>Bot</th><th>Aura</th><th>vs NPC</th><th>Trash talk</th></tr>` +
  D.board.map((a, i) => `<tr><td class="rank">${medal(i)}</td>
    <td class="n">${esc(a.name)}<small>gen ${a.gen} · ${esc(a.personality)}</small></td>
    <td class="aura ${a.aura >= 0 ? "pos" : "neg"}">${a.aura >= 0 ? "+" : ""}${a.aura}<br><small style="color:var(--dim);font-weight:400">${a.wins}W ${a.losses}L ${a.draws}D</small></td>
    <td>${pct(a.vs_npc)}<div class="bar"><div style="width:${pct(a.vs_npc)}"></div></div></td>
    <td class="trash">${a.trash ? "“" + esc(a.trash) + "”" : ""}</td></tr>`).join("");

// bloodline
document.getElementById("tree").innerHTML = D.lineage.map(t =>
  `<li><b>${esc(t.name)}</b> <small>gen ${t.gen}</small><br><small>${esc(t.personality)}</small><br><small>${esc(t.playbook)}</small></li>`).join("");

// replays
const GLYPH = {k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟\uFE0E"};
const boardEl = document.getElementById("board"), feed = document.getElementById("feed");
for (let i = 0; i < 64; i++) boardEl.insertAdjacentHTML("beforeend", `<div class="sq ${((i >> 3) + i) % 2 ? "d" : "l"}"></div>`);
const sqs = [...boardEl.children];
function draw(fen) {
  let i = 0;
  for (const ch of fen.replace(/\//g, "")) {
    if (/\d/.test(ch)) for (let k = 0; k < +ch; k++) sqs[i++].innerHTML = "";
    else sqs[i++].innerHTML = `<span class="${ch === ch.toUpperCase() ? "pw" : "pb"}">${GLYPH[ch.toLowerCase()]}</span>`;
  }
}
let cur = 0, ply = 0, timer;
function addLine(p) {
  const r = D.replays[cur], c = r.comments[p];
  if (!c && p !== r.sans.length - 1) return;
  const num = Math.floor(p / 2) + 1 + (p % 2 ? "…" : ".");
  feed.insertAdjacentHTML("afterbegin", `<div class="${/MATE|QUEEN/.test(c) ? "big" : ""}"><b>${num} ${esc(r.sans[p])}</b>${esc(c || "game over")}</div>`);
}
function status() {
  const r = D.replays[cur];
  document.getElementById("ply").textContent = `move ${Math.ceil(ply / 2)} / ${Math.ceil(r.sans.length / 2)}`;
}
function load(i) {
  clearInterval(timer); cur = i; ply = 0; feed.innerHTML = "";
  const r = D.replays[i];
  document.querySelectorAll(".tabs button").forEach((b, j) => b.classList.toggle("on", j === i));
  const res = r.winner ? `${esc(r.winner)} wins by ${esc(r.how)}` : esc(r.how);
  document.getElementById("who").innerHTML = `<span style="color:var(--pink)">♟&#xFE0E;</span> <b>${esc(r.white)}</b> vs <span style="color:var(--teal)">♟&#xFE0E;</span> <b>${esc(r.black)}</b> · ${res}`;
  draw(r.fens[0]); status();
}
document.getElementById("tabs").innerHTML = D.replays.map((r, i) => `<button>${esc(r.label)}</button>`).join("");
document.querySelectorAll(".tabs button").forEach((b, i) => b.onclick = () => load(i));
document.getElementById("play").onclick = () => {
  const r = D.replays[cur];
  clearInterval(timer);
  if (ply >= r.sans.length) { ply = 0; feed.innerHTML = ""; }
  timer = setInterval(() => {
    if (ply >= r.sans.length) return clearInterval(timer);
    addLine(ply); ply++; draw(r.fens[ply]); status();
  }, 220);
};
document.getElementById("skip").onclick = () => {
  const r = D.replays[cur];
  clearInterval(timer);
  while (ply < r.sans.length) { addLine(ply); ply++; }
  draw(r.fens[ply]); status();
};
if (D.replays.length) load(D.replays.length - 1);
</script>
</body>
</html>
